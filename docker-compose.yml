services:
  # 1. TRẠM TRUNG CHUYỂN TIN NHẮN
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ketibmall_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ketib_network

  # 2. DATABASE CHO APP (BÁN HÀNG)
  db_app:
    image: postgres:15-alpine
    container_name: ketibmall_db_app
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
      POSTGRES_DB: ${APP_DB_NAME}
    networks:
      - ketib_network

  # 3. DATABASE CHO INVENTORY (KHO)
  db_inventory:
    image: postgres:15-alpine
    container_name: ketibmall_db_inventory
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
      POSTGRES_DB: ${INVENTORY_DB_NAME}
    networks:
      - ketib_network

  # 4. API SERVER - APP (PORT 8000)
  app_api:
    build: ./KetibMall_App
    container_name: ketibmall_app_server
    restart: always
    volumes:
      - ./KetibMall_App/static:/app/static
    depends_on:
      rabbitmq:
        condition: service_healthy
      db_app:
        condition: service_started
    env_file: ./KetibMall_App/.env
    networks:
      - ketib_network

  # 5. API SERVER - INVENTORY (PORT 8001)
  inventory_api:
    build: ./KetibMall_Inventory
    container_name: ketibmall_inventory_server
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
      db_inventory:
        condition: service_started
    env_file: ./KetibMall_Inventory/.env
    networks:
      - ketib_network

  # 6. WORKER XỬ LÝ ĐƠN HÀNG (BÊN INVENTORY)
  inventory_worker:
    build: ./KetibMall_Inventory
    container_name: inventory_order_consumer
    restart: always
    command: python -m src.integration.consumer.consumer
    depends_on:
      rabbitmq:
        condition: service_healthy
      db_inventory:
        condition: service_started
    env_file: ./KetibMall_Inventory/.env
    networks:
      - ketib_network

  # 7. WORKER ĐỒNG BỘ KHO (BÊN APP)
  app_stock_worker:
    build: ./KetibMall_App
    container_name: app_stock_consumer
    restart: always
    command: python -m src.integration.consumer.stock_consumer
    depends_on:
      rabbitmq:
        condition: service_healthy
      db_app:
        condition: service_started
    env_file: ./KetibMall_App/.env
    networks:
      - ketib_network

  # 8. API GATEWAY (NGINX) - CỬA CHÍNH DUY NHẤT
  api-gateway:
    image: nginx:latest
    container_name: ketibmall_api_gateway
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # THÊM DÒNG NÀY: Copy toàn bộ Frontend giao cho Nginx quản lý
      - ./KetibMall_Frontend:/usr/share/nginx/html:ro 
    depends_on:
      - app_api
      - inventory_api
    networks:
      - ketib_network

  redis_cache:
    image: redis:7-alpine
    container_name: ketibmall_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASS}
    networks:
      - ketib_network

networks:
  ketib_network:
    driver: bridge