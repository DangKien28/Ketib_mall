<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Sign Up | KetibMall</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1337ec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101322",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
    <div class="layout-container flex h-full grow flex-col items-center justify-center p-4">
        <div class="w-full max-w-[480px] bg-white dark:bg-slate-900 shadow-xl rounded-xl overflow-hidden border border-slate-200 dark:border-slate-800">
            <header class="flex flex-col items-center pt-10 pb-6 px-10">
                <div class="flex items-center gap-2 mb-4">
                    <div class="size-10 overflow-hidden rounded-lg">
                        <img src="http://localhost:8000/static/logo_TK.png" alt="Logo" class="w-full h-full object-contain" >
                    </div>
                    <h2 class="text-2xl font-bold tracking-tight">KetibMall</h2>
                </div>
                <h1 class="text-2xl font-bold text-slate-900 dark:text-slate-100">Create Account</h1>
                <p class="text-slate-500 dark:text-slate-400 mt-2 text-center">Join our community and start shopping today</p>
            </header>

            <form id="register-form" class="px-8 pb-10 space-y-5">
                <div class="flex flex-col gap-1.5">
                    <label class="text-sm font-semibold text-slate-700 dark:text-slate-300 ml-1">Full Name</label>
                    <div class="relative flex items-center">
                        <span class="material-symbols-outlined absolute left-3 text-slate-400 text-[20px] pointer-events-none">person</span>
                        <input id="reg-name" class="w-full pl-10 pr-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-primary outline-none transition-all text-slate-900 dark:text-slate-100 placeholder-slate-400" placeholder="John Doe" type="text" required/>
                    </div>
                </div>

                <div class="flex flex-col gap-1.5">
                    <label class="text-sm font-semibold text-slate-700 dark:text-slate-300 ml-1">Email Address</label>
                    <div class="relative flex items-center">
                        <span class="material-symbols-outlined absolute left-3 text-slate-400 text-[20px] pointer-events-none">mail</span>
                        <input id="reg-email" class="w-full pl-10 pr-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-primary outline-none transition-all text-slate-900 dark:text-slate-100 placeholder-slate-400" placeholder="name@example.com" type="email" required/>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="flex flex-col gap-1.5">
                        <label class="text-sm font-semibold text-slate-700 dark:text-slate-300 ml-1">Password</label>
                        <div class="relative flex items-center">
                            <span class="material-symbols-outlined absolute left-3 text-slate-400 text-[20px] pointer-events-none">lock</span>
                            <input id="reg-password" class="w-full pl-10 pr-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-primary outline-none transition-all text-slate-900 dark:text-slate-100 placeholder-slate-400" placeholder="••••••••" type="password" required/>
                        </div>
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label class="text-sm font-semibold text-slate-700 dark:text-slate-300 ml-1">Confirm Password</label>
                        <div class="relative flex items-center">
                            <span class="material-symbols-outlined absolute left-3 text-slate-400 text-[20px] pointer-events-none">shield_lock</span>
                            <input id="reg-confirm" class="w-full pl-10 pr-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-primary outline-none transition-all text-slate-900 dark:text-slate-100 placeholder-slate-400" placeholder="••••••••" type="password" required/>
                        </div>
                    </div>
                </div>

                <div class="flex items-start gap-3 py-2">
                    <input class="mt-1 h-4 w-4 rounded border-slate-300 text-primary focus:ring-primary" id="terms" type="checkbox" required/>
                    <label class="text-sm text-slate-600 dark:text-slate-400 leading-tight" for="terms">
                        By creating an account, you agree to our 
                        <a class="text-primary hover:underline font-medium" href="#">Terms of Service</a> and 
                        <a class="text-primary hover:underline font-medium" href="#">Privacy Policy</a>.
                    </label>
                </div>

                <button type="submit" class="w-full py-3.5 bg-primary hover:bg-opacity-90 text-white font-bold rounded-lg shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2 mt-4">
                    Create Account
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
                </button>

                <div class="pt-6 border-t border-slate-100 dark:border-slate-800 flex flex-col items-center gap-4">
                    <p class="text-sm text-slate-500 dark:text-slate-400">
                        Already have an account? 
                        <a class="text-primary font-bold hover:underline" href="login.html">Log In</a>
                    </p>
                </div>
            </form>
        </div>
        <footer class="mt-8 text-center text-slate-400 text-xs">
            © 2024 KetibMall Inc. All rights reserved.
        </footer>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
