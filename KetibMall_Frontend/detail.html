<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>KetibMall | Chi tiết sản phẩm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1" rel="stylesheet"/>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { "primary": "#2563eb" },
                    fontFamily: { "display": ["Plus Jakarta Sans", "sans-serif"] }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px); border-bottom: 1px solid #e2e8f0; }
    </style>
</head>
<body class="text-slate-900">
    <nav class="glass-nav sticky top-0 z-50 px-6 py-4">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="app.html" class="flex items-center gap-2 text-slate-600 hover:text-primary transition-all font-bold">
                <span class="material-symbols-outlined">arrow_back</span>
                Quay lại cửa hàng
            </a>
            
            <div class="flex items-center gap-6">
                <div id="user-display" class="flex items-center gap-4"></div>
                <div class="relative p-2 text-slate-600">
                    <span class="material-symbols-outlined">shopping_cart</span>
                    <span id="cart-count" class="absolute -top-1 -right-1 bg-primary text-white text-[10px] font-bold h-4 w-4 flex items-center justify-center rounded-full">0</span>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-6 py-12 md:py-20">
        <div id="product-detail" class="grid grid-cols-1 md:grid-cols-2 gap-12 bg-white p-8 md:p-12 rounded-[2.5rem] shadow-sm border border-slate-100">
            <div class="animate-pulse flex flex-col gap-4">
                <div class="bg-slate-100 aspect-square rounded-3xl"></div>
            </div>
            <div class="animate-pulse flex flex-col gap-6 justify-center">
                <div class="h-4 bg-slate-100 w-1/4 rounded"></div>
                <div class="h-10 bg-slate-100 w-3/4 rounded"></div>
                <div class="h-20 bg-slate-100 w-full rounded"></div>
                <div class="h-12 bg-slate-100 w-1/2 rounded mt-4"></div>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const productId = params.get('id');
            if (productId) {
                loadProductDetail(productId);
            } else {
                window.location.href = "app.html";
            }
        });

        async function loadProductDetail(id) {
            try {
                // Gọi API lấy danh sách và tìm sản phẩm theo ID
                const response = await fetch(`http://localhost:8000/api/products/`);
                const products = await response.json();
                const product = products.find(p => p.id === id);

                if (product) {
                    renderDetail(product);
                } else {
                    document.getElementById('product-detail').innerHTML = `
                        <div class="col-span-full text-center py-20">
                            <h2 class="text-2xl font-bold text-slate-400">Không tìm thấy sản phẩm</h2>
                            <a href="app.html" class="text-primary font-bold mt-4 block underline">Quay lại trang chủ</a>
                        </div>`;
                }
            } catch (e) {
                console.error("Lỗi tải chi tiết:", e);
            }
        }

        function renderDetail(p) {
            const container = document.getElementById('product-detail');
            const isOutOfStock = p.cached_stock <= 0;

            container.innerHTML = `
                <div class="relative overflow-hidden rounded-[2rem] bg-slate-50 border border-slate-100">
                    <img src="${p.image_url || ''}" 
                         class="w-full h-full object-cover transition-transform duration-700 hover:scale-110 ${isOutOfStock ? 'grayscale contrast-75' : ''}" 
                         onerror="this.onerror=null; this.src='http://localhost:8000/static/logo_TK.png';">
                    ${isOutOfStock ? `
                        <div class="absolute inset-0 bg-slate-900/20 backdrop-blur-[2px] flex items-center justify-center">
                            <span class="bg-red-500 text-white font-black px-6 py-2 rounded-full shadow-xl">HẾT HÀNG</span>
                        </div>
                    ` : ''}
                </div>
                
                <div class="flex flex-col justify-center">
                    <div class="flex items-center gap-2 mb-4">
                        <span class="px-3 py-1 bg-blue-50 text-primary text-[10px] font-bold rounded-full uppercase tracking-widest">Sản phẩm #${p.id}</span>
                        ${!isOutOfStock ? '<span class="px-3 py-1 bg-green-50 text-green-600 text-[10px] font-bold rounded-full uppercase tracking-widest">Sẵn sàng giao</span>' : ''}
                    </div>
                    
                    <h1 class="text-4xl md:text-5xl font-extrabold text-slate-900 mb-6 leading-tight">${p.name}</h1>
                    
                    <div class="prose prose-slate mb-8">
                        <p class="text-slate-500 text-lg leading-relaxed">${p.description || 'Chưa có mô tả chi tiết cho sản phẩm này.'}</p>
                    </div>
                    
                    <div class="mb-10 p-6 bg-slate-50 rounded-3xl border border-slate-100">
                        <div class="flex items-baseline gap-2">
                            <span class="text-4xl font-black text-slate-900">${p.price.toLocaleString()}đ</span>
                        </div>
                        <p class="text-sm font-bold mt-2 ${isOutOfStock ? 'text-red-500' : 'text-slate-400'}">
                            <span class="material-symbols-outlined text-[16px] align-middle mr-1">
                                ${isOutOfStock ? 'block' : 'inventory_2'}
                            </span>
                            ${isOutOfStock ? 'Sản phẩm hiện đang tạm hết hàng' : `Còn lại ${p.cached_stock} sản phẩm trong kho`}
                        </p>
                    </div>

                    <div class="flex gap-4">
                        <button 
                            onclick="addToCart('${p.id}', '${p.name}', ${p.price})"
                            ${isOutOfStock ? 'disabled' : ''}
                            class="flex-1 py-5 rounded-2xl font-bold transition-all flex items-center justify-center gap-3 ${isOutOfStock ? 'bg-slate-200 text-slate-400 cursor-not-allowed' : 'bg-primary text-white hover:bg-blue-700 shadow-xl shadow-primary/20 active:scale-95'}">
                            <span class="material-symbols-outlined">${isOutOfStock ? 'block' : 'shopping_cart_checkout'}</span>
                            ${isOutOfStock ? 'Hết hàng' : 'Thêm vào giỏ hàng'}
                        </button>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
