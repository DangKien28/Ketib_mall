<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>KetibMall | Modern Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1" rel="stylesheet"/>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { "primary": "#2563eb" },
                    fontFamily: { "display": ["Plus Jakarta Sans", "sans-serif"] }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px); border-bottom: 1px solid #e2e8f0; }
    </style>
</head>
<body class="text-slate-900">
    <nav class="glass-nav sticky top-0 z-50 px-6 py-4">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2">
                <img src="http://localhost:8080/static/logo_TK.png" alt="Logo" class="h-9 w-auto">
                <span class="text-xl font-bold">Ketib<span class="text-primary">Mall</span></span>
            </div>

            <div class="flex items-center gap-4 ml-auto">
                <div id="user-info" class="text-sm font-medium text-gray-700"></div>
                <button id="logout-btn" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded transition">Đăng xuất</button>
            </div>
            
            <div class="flex items-center gap-6">
                <div id="user-display" class="flex items-center gap-4"></div>
                
                <button onclick="toggleCart()" class="relative p-2 text-slate-600">
                    <span class="material-symbols-outlined">shopping_cart</span>
                    <span id="cart-count" class="absolute -top-1 -right-1 bg-primary text-white text-[10px] font-bold h-4 w-4 flex items-center justify-center rounded-full">0</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-10">
        <div class="mb-8 max-w-2xl mx-auto">
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                <input type="text" id="search-input" 
                    class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-xl leading-5 bg-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-shadow shadow-sm sm:text-sm" 
                    placeholder="Nhập tên sản phẩm bạn muốn tìm (Ví dụ: Áo thun, Quần jean...)"
                    onkeyup="searchProducts()">
            </div>
        </div>
        <h2 class="text-3xl font-bold text-gray-800 mb-8">Sản phẩm nổi bật</h2>
        
        <section id="section-available" class="mb-16">
            <div class="flex items-center gap-3 mb-8">
                <span class="material-symbols-outlined text-green-500">check_circle</span>
                <h1 class="text-3xl font-extrabold text-slate-900">Sản phẩm sẵn có</h1>
            </div>
            <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
            </div>
        </section>

        <section id="section-outofstock">
            <div class="flex items-center gap-3 mb-8 border-t border-slate-200 pt-12">
                <span class="material-symbols-outlined text-slate-400">inventory_2</span>
                <h2 class="text-2xl font-bold text-slate-500">Sản phẩm tạm hết hàng</h2>
            </div>
            <div id="product-grid-out" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
            </div>
        </section>
    </main>

    <div id="cart-sidebar" class="fixed right-0 top-0 h-full w-96 bg-white shadow-2xl z-[60] transform translate-x-full transition-transform duration-300 p-6 flex flex-col border-l border-slate-100">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-bold">Giỏ hàng</h2>
            <button onclick="toggleCart()"><span class="material-symbols-outlined">close</span></button>
        </div>
        
        <div id="cart-items" class="flex-1 overflow-y-auto space-y-4 mb-4"></div>
        
        <div class="py-4 border-t border-slate-100 space-y-3">
            <h3 class="font-semibold text-sm text-gray-700 flex items-center gap-1">
                <span class="material-symbols-outlined text-base">location_on</span> Giao hàng đến:
            </h3>
            
            <input type="text" id="shipping-address" placeholder="Số nhà, Tên đường..." 
                   class="w-full text-sm border border-gray-300 rounded-lg p-2.5 bg-gray-50 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            
            <div class="flex flex-col gap-2 text-sm">
                <select id="province-select" onchange="loadDistricts()" class="w-full border border-gray-300 rounded-lg p-2.5 bg-gray-50 outline-none focus:ring-blue-500">
                    <option value="">-- Chọn Tỉnh/Thành --</option>
                </select>
                
                <div class="flex gap-2">
                    <select id="district-select" onchange="loadWards()" disabled class="w-1/2 border border-gray-300 rounded-lg p-2.5 bg-gray-50 outline-none disabled:bg-gray-200">
                        <option value="">-- Quận/Huyện --</option>
                    </select>
                    
                    <select id="ward-select" onchange="calculateShipping()" disabled class="w-1/2 border border-gray-300 rounded-lg p-2.5 bg-gray-50 outline-none disabled:bg-gray-200">
                        <option value="">-- Phường/Xã --</option>
                    </select>
                </div>
            </div>
            
            <div class="flex justify-between text-sm font-semibold text-gray-600 mt-2">
                <span>Phí vận chuyển:</span>
                <span class="text-red-500"><span id="shipping-fee-display">0</span> đ</span>
            </div>
        </div>
        <div class="pt-4 border-t border-slate-100">
            <div class="flex justify-between mb-4">
                <span class="text-slate-500 font-medium">Tổng thanh toán:</span>
                <span id="cart-total" class="font-bold text-2xl text-primary">0đ</span>
            </div>
            <button id="checkout-btn" class="w-full py-4 bg-primary text-white font-bold rounded-xl active:scale-95 transition-transform shadow-lg shadow-primary/20">
                Thanh toán ngay
            </button>
        </div>
    </div>

    <script>
        function toggleCart() {
            document.getElementById('cart-sidebar').classList.toggle('translate-x-full');
        }
    </script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
