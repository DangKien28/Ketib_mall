<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>KetibMall - Shop</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen">
    <div id="user-display" class="text-sm font-medium text-slate-600 mr-4"></div>
    <nav class="sticky top-0 z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
        <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-blue-600 p-1.5 rounded-lg text-white">
                    <span class="material-symbols-outlined block">shopping_bag</span>
                </div>
                <span class="text-xl font-bold tracking-tight">KetibMall</span>
            </div>
            <div class="relative">
                <span class="material-symbols-outlined">shopping_cart</span>
                <span id="cart-count-badge" class="absolute -top-2 -right-2 bg-red-500 text-white text-[10px] px-1.5 py-0.5 rounded-full">0</span>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="flex flex-col lg:flex-row gap-8">
            <div class="flex-1">
                <h1 class="text-2xl font-extrabold mb-8">Featured Products</h1>
                <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    <p class="text-slate-400">Loading products...</p>
                </div>
            </div>

            <aside class="w-full lg:w-80 shrink-0">
                <div class="sticky top-24 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-6 shadow-xl">
                    <h2 class="text-xl font-bold mb-6 flex items-center gap-2">
                        <span class="material-symbols-outlined text-blue-600">shopping_cart</span>
                        Your Bag
                    </h2>
                    
                    <div id="cart-items" class="space-y-4 mb-8">
                        <p class="text-sm text-slate-500 italic">Your bag is empty.</p>
                    </div>

                    <div class="border-t border-slate-100 dark:border-slate-800 pt-4 mb-6">
                        <div class="flex justify-between text-lg font-bold">
                            <span>Total</span>
                            <span id="total-price" class="text-blue-600">$0.00</span>
                        </div>
                    </div>
                    
                    <button id="checkout-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                        Place Order
                    </button>
                </div>
            </aside>
        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
